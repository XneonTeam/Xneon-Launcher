<!doctype html>
<html lang="ru" class="h-full dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xneon Launcher</title>
    <script>
      try {
        var cachedTheme = window.electronAPI && window.electronAPI.startupThemeSnapshot;
        if (cachedTheme) {
          var startupTheme = JSON.parse(cachedTheme);
          document.documentElement.classList.toggle('dark', startupTheme.mode === 'dark');
          document.documentElement.style.colorScheme = startupTheme.mode;
          Object.entries(startupTheme.colors).forEach(function(entry) { document.documentElement.style.setProperty(entry[0], entry[1]); });
        }
      } catch (_) {}
    </script>
  </head>
  <body class="h-full">
    <div id="splash" role="status" aria-label="Загрузка Xneon Launcher">
      <style>
        #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:var(--background, #141420);color:var(--foreground, #e4e4e7);font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow:hidden}
        #splash::before{content:'';position:absolute;top:-140px;left:50%;transform:translateX(-50%);width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb, var(--primary, #a1a1aa) 12%, transparent) 0%,transparent 70%);pointer-events:none}
        #splash::after{content:'';position:absolute;bottom:-100px;right:-60px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb, var(--primary, #a1a1aa) 6%, transparent) 0%,transparent 70%);pointer-events:none}
        #splash .logo-wrap{position:relative;display:flex;align-items:center;justify-content:center;width:176px;height:176px}
        #splash .logo-wrap svg{width:144px;height:144px;overflow:visible}
        #splash .logo-wrap #stroke-path{fill:none;stroke:var(--primary, #a1a1aa);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 12px var(--glow-primary, #a1a1aa33));animation:draw 2.4s ease-in-out forwards}
        #splash .logo-wrap #fill-path{fill:var(--primary, #a1a1aa);opacity:0;filter:drop-shadow(0 0 20px var(--glow-primary, #a1a1aa33)) drop-shadow(0 0 40px color-mix(in srgb, var(--primary, #a1a1aa) 12%, transparent));animation:reveal .6s ease-out forwards;animation-delay:2.2s}
        @keyframes draw{to{stroke-dashoffset:0}}
        @keyframes reveal{to{opacity:1}}
        #splash .title{font-size:30px;font-weight:700;letter-spacing:.3px;background:linear-gradient(135deg,var(--primary, #a1a1aa) 0%,var(--accent, #d4d4d8) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;opacity:0;animation:fadeUp .6s ease-out forwards;animation-delay:0s}
        #splash .bar-track{width:400px;height:6px;border-radius:3px;background:var(--border, #30303b);overflow:hidden;opacity:0;animation:fadeUp .6s ease-out forwards;animation-delay:.1s}
        #splash .bar-fill{width:40%;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--primary, #a1a1aa),var(--accent, #d4d4d8));animation:splash-slide 1.4s ease-in-out infinite}
        @keyframes splash-slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
        #splash .hint{font-size:22px;color:var(--muted-foreground, #71717a);letter-spacing:.2px;opacity:0;animation:fadeUp .6s ease-out forwards;animation-delay:.2s}
        @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
      </style>

        </svg>
      </div>
      <div class="title">Xneon Launcher</div>
      <div class="bar-track"><div class="bar-fill"></div></div>
      <div class="hint">Загрузка...</div>
      <script>
        requestAnimationFrame(function(){document.getElementById('splash')?.setAttribute('data-started-at', String(performance.now()))});
        var s=document.getElementById('stroke-path');
        var l=s.getTotalLength();
        s.style.strokeDasharray=l;
        s.style.strokeDashoffset=l;
      </script>
    </div>
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
