packages:
  - "packages/*"

# better-sqlite3 v13 ships prebuilt Node-API binaries (prebuilds/<platform>-<arch>.node,
# "gypfile": false), so the implicit `node-gyp rebuild` must stay skipped — N-API keeps
# the binary ABI-stable between Node and Electron, so no electron-rebuild step is needed.
allowBuilds:
  better-sqlite3: false
  esbuild: true
  electron-winstaller: true
  register-scheme: true
  register-scheme@https://codeload.github.com/devsnek/node-register-scheme/tar.gz/e7cc9a63a1f512565da44cb57316d9fb10750e17: true

strictDepBuilds: false
blockExoticSubdeps: false

overrides:
  "shell-quote": ">=1.9.0"
  "@xnlc/core>adm-zip": "^0.6.0"
