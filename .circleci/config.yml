version: 2.1

jobs:
  build-linux:
    docker:
      - image: cimg/node:22.12
    steps:
      - checkout

      - run:
          name: Install system deps
          command: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.0-dev

      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package-lock.json" }}
            - v1-dependencies-

      - run:
          name: Install dependencies
          command: npm ci --include=optional || npm install

      - run:
          name: Install rolldown binding
          command: npm install @rolldown/binding-linux-x64-gnu --no-save

      - save_cache:
          paths:
            - ~/.npm
          key: v1-dependencies-{{ checksum "package-lock.json" }}

      - run:
          name: Build app
          command: npm run build

      - run:
          name: Package Linux
          command: npx electron-builder --linux AppImage --publish never

      - persist_to_workspace:
          root: .
          paths:
            - release

  build-windows:
    docker:
      - image: cimg/node:22.12
    steps:
      - checkout

      - run:
          name: Install cross-build deps
          command: sudo apt-get update -qq && sudo apt-get install -y -qq wine64 xvfb

      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package-lock.json" }}
            - v1-dependencies-

      - run:
          name: Install dependencies
          command: npm ci --include=optional || npm install

      - run:
          name: Install rolldown binding
          command: npm install @rolldown/binding-linux-x64-gnu --no-save

      - save_cache:
          paths:
            - ~/.npm
          key: v1-dependencies-{{ checksum "package-lock.json" }}

      - run:
          name: Build app
          command: npm run build

      - run:
          name: Package Windows
          command: xvfb-run -a npx electron-builder --win nsis --publish never

      - persist_to_workspace:
          root: .
          paths:
            - release

  build-macos:
    macos:
      xcode: "15.4.0"
    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-macos-dependencies-{{ checksum "package-lock.json" }}
            - v1-macos-dependencies-

      - run:
          name: Install dependencies
          command: npm ci --include=optional || npm install

      - run:
          name: Install rolldown binding
          command: npm install @rolldown/binding-darwin-arm64 --no-save

      - save_cache:
          paths:
            - ~/.npm
          key: v1-macos-dependencies-{{ checksum "package-lock.json" }}

      - run:
          name: Build app
          command: npm run build

      - run:
          name: Package macOS
          command: npx electron-builder --mac dmg --publish never

      - persist_to_workspace:
          root: .
          paths:
            - release

  release:
    docker:
      - image: cimg/node:22.12
    steps:
      - checkout
      - attach_workspace:
          at: .

      - run:
          name: Upload artifacts to GitHub release
          command: |
            if [ -z "$CIRCLE_TAG" ]; then
              echo "Not a tag push, skipping release."
              exit 0
            fi

            echo "Looking up GitHub release for tag ${CIRCLE_TAG}..."

            RESPONSE_FILE="$(mktemp)"

            # Try to find existing release by tag first
            HTTP_CODE="$(curl -sS -o "${RESPONSE_FILE}" -w "%{http_code}" \
              "https://api.github.com/repos/MAINER4IK/xnlauncher/releases/tags/${CIRCLE_TAG}" \
              -H "Authorization: token ${GITHUB_TOKEN}")"

            if [ "${HTTP_CODE}" = "200" ]; then
              RELEASE_ID="$(grep -o '"id":[0-9]*' "${RESPONSE_FILE}" | head -1 | cut -d: -f2)"
              echo "Found existing release ID: ${RELEASE_ID}"
            else
              echo "No existing release found (HTTP ${HTTP_CODE}), creating one..."
              BODY="Release ${CIRCLE_TAG}"
              JSON="{\"tag_name\":\"${CIRCLE_TAG}\",\"name\":\"${CIRCLE_TAG}\",\"body\":\"${BODY}\",\"draft\":false,\"prerelease\":false}"

              HTTP_CODE="$(curl -sS -o "${RESPONSE_FILE}" -w "%{http_code}" \
                -X POST "https://api.github.com/repos/MAINER4IK/xnlauncher/releases" \
                -H "Authorization: token ${GITHUB_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "${JSON}")"

              if [ "${HTTP_CODE}" != "201" ]; then
                echo "Release creation failed with status ${HTTP_CODE}:"
                cat "${RESPONSE_FILE}"
                exit 1
              fi

              RELEASE_ID="$(grep -o '"id":[0-9]*' "${RESPONSE_FILE}" | head -1 | cut -d: -f2)"
            fi

            if [ -z "${RELEASE_ID}" ]; then
              echo "Could not parse release id:"
              cat "${RESPONSE_FILE}"
              exit 1
            fi

            echo "Release ID: ${RELEASE_ID}"

            if [ -d "release" ]; then
              find release -type f | while read -r file; do
                FILENAME="$(basename "${file}")"
                echo "Uploading ${FILENAME}..."
                curl -sS -f \
                  -X POST "https://uploads.github.com/repos/MAINER4IK/xnlauncher/releases/${RELEASE_ID}/assets?name=${FILENAME}" \
                  -H "Authorization: token ${GITHUB_TOKEN}" \
                  -H "Content-Type: application/octet-stream" \
                  --data-binary @"${file}"
              done
            fi

workflows:
  release:
    jobs:
      - build-linux:
          filters:
            tags:
              only: /v.*/
            branches:
              ignore: /.*/
      - build-windows:
          filters:
            tags:
              only: /v.*/
            branches:
              ignore: /.*/
      - build-macos:
          filters:
            tags:
              only: /v.*/
            branches:
              ignore: /.*/
      - release:
          requires:
            - build-linux
            - build-windows
            - build-macos
          filters:
            tags:
              only: /v.*/
            branches:
              ignore: /.*/
