name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        include:
          - os: ubuntu-latest
            artifact_name: XNeon-Launcher-Linux
          - os: windows-latest
            artifact_name: XNeon-Launcher-Windows
          - os: macos-latest
            artifact_name: XNeon-Launcher-macOS
    runs-on: ${{ matrix.os }}

    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev

      - name: Install dependencies
        run: npm ci

      - name: Package
        run: npm run package

      - name: Upload artifacts
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: https://data.forgejo.org/actions/download-artifact@v3
        with:
          path: artifacts

      - name: Create release
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_API_URL: ${{ forgejo.api_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          TAG_NAME: ${{ forgejo.ref_name }}
        run: |
          set -eu

          OWNER="${FORGEJO_REPOSITORY%%/*}"
          REPO="${FORGEJO_REPOSITORY#*/}"
          API="${FORGEJO_API_URL}/repos/${OWNER}/${REPO}/releases"

          echo "Creating release for tag ${TAG_NAME}..."

          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl -sS -o "${RESPONSE_FILE}" -w "%{http_code}" \
            -X POST "${API}" \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(cat <<EOF
          {
            "tag_name": "${TAG_NAME}",
            "name": "${TAG_NAME}",
            "body": "Release ${TAG_NAME}",
            "draft": false,
            "prerelease": false
          }
          EOF
          )")"

          if [ "${HTTP_CODE}" != "201" ]; then
            echo "Release creation failed with status ${HTTP_CODE}:"
            cat "${RESPONSE_FILE}"
            exit 1
          fi

          RELEASE_ID="$(grep -o '"id":[0-9]*' "${RESPONSE_FILE}" | head -1 | cut -d: -f2)"

          if [ -z "${RELEASE_ID}" ]; then
            echo "Could not parse release id from Forgejo response:"
            cat "${RESPONSE_FILE}"
            exit 1
          fi

          echo "Release ID: ${RELEASE_ID}"

          find artifacts -type f | while read -r file; do
            echo "Uploading $(basename "${file}")..."
            curl -sS -f \
              -X POST "${API}/${RELEASE_ID}/assets" \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -F "attachment=@${file}"
          done
