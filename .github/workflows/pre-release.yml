name: Pre-release

# Пререлиз (beta/canary): тег vX.Y.Z-preN или vX.Y.Z-betaN.
on:
  push:
    tags: ['v*-pre*', 'v*-beta*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: false

env:
  HUTCH_NO_UPDATE_CHECK: '1'
  BUN_OPTIONS: --no-env-file
  XNLC_SKIP_LOCAL_DOTENV: '1'
  XNLC_PARSER_LIVE_TESTS: '0'
  CHANNEL: canary

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - &checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          desktop: 'true'
      - name: Check release channel
        run: bun scripts/ci-pre-release.ts channel
      - name: Check version tag and main ancestry before the protected release
        if: github.repository == 'MAINER4IK/Xneon-Launcher-bun' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci-pre-release.ts guard-tag
      - run: bun scripts/gen-agent-ipc-catalog.mjs --check
      - run: bun run prepare:desktop
      - run: bun scripts/check-config.mjs
      - run: bun scripts/check-import-cycles.mjs
      - run: bun run typecheck
      - name: Validate GitHub Actions syntax, expressions and dependencies
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$archive" | sha256sum --check -
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: Transpile main modules for desktop tests
        run: bun scripts/build-electrobun-tests.mjs
      - name: Offline tests (workspaces already prepared)
        run: bun run test:offline:prepared
      - name: Production renderer and worker bundles
        run: |
          bun run build:renderer
          bun run build:workers

  # NSIS остаётся в stable; portable собирается независимо и для canary.
  build:
    needs: tests
    if: >-
      ${{ github.repository == 'MAINER4IK/Xneon-Launcher-bun' &&
          (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          # Временно публикуем только Windows; Unix-шаги ниже сохранены для возврата платформ.
          - { runner: windows-2022, target: win-x64, platform: win, arch: x64, machine: X64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - *checkout
      - uses: ./.github/actions/setup
        with:
          desktop: 'true'
          linux-native-build: ${{ runner.os == 'Linux' && 'true' || 'false' }}
      - name: Check release tag and package version before building
        if: startsWith(github.ref, 'refs/tags/v')
        run: bun scripts/ci-pre-release.ts identity
      - name: Check native target
        shell: bash
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          RUNNER_MACHINE: ${{ runner.arch }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            test "$RUNNER_MACHINE" = "$EXPECTED_MACHINE"
          else
            test "$(uname -m)" = "$EXPECTED_MACHINE"
          fi
      - name: Build canary native artifacts
        run: bun run build:canary
      - name: Verify native platform adapters skipped on Ubuntu
        if: runner.os != 'Linux'
        run: |
          set -euo pipefail
          bun test tests/electrobun/platform-desktop.test.ts tests/electrobun/platform-secrets.test.ts tests/electrobun/platform-unix.test.ts
          if [ "$RUNNER_OS" = Windows ]; then
            bun test tests/tooling/electrobun-packaging.test.mjs --test-name-pattern 'PE metadata'
          fi
      - name: Validate Windows payload and staging
        if: runner.os == 'Windows'
        run: bun scripts/validate-pre-release.ts release-electrobun/canary checked-native canary
      - name: Stage native Unix artifacts without repackaging
        if: runner.os != 'Windows'
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: bun scripts/electrobun-artifacts.ts stage release-electrobun/canary checked-native "$TARGET_PLATFORM" "$TARGET_ARCH" canary
      - name: Build Linux distribution packages
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm libarchive-tools xz-utils squashfs-tools file
          bun scripts/package-linux.ts checked-native checked-packages
      - name: Verify native Linux executable
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          shopt -s nullglob
          launchers=(build-electrobun/canary-linux-x64/*/bin/launcher)
          test "${#launchers[@]}" -eq 1
          test -x "${launchers[0]}"
          LC_ALL=C readelf -h "${launchers[0]}" | awk '/Machine:/ && /X86-64/ { ok=1 } END { exit !ok }'
      - name: Verify native macOS image and application bundle
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(release-electrobun/canary/*.dmg)
          apps=(build-electrobun/canary-"$TARGET"/*.app)
          test "${#images[@]}" -eq 1
          test "${#apps[@]}" -eq 1
          plist="${apps[0]}/Contents/Info.plist"
          executable="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$plist")"
          [[ "$executable" != */* ]]
          test -x "${apps[0]}/Contents/MacOS/$executable"
          test "$(lipo -archs "${apps[0]}/Contents/MacOS/$executable")" = "$EXPECTED_MACHINE"
          # Версия payload уже проверена validator; wrapper содержит metadata.json, а не CFBundleShortVersionString.
          BUNDLE_METADATA_FILE="${apps[0]}/Contents/Resources/metadata.json" UPDATE_MANIFEST_FILE="release-electrobun/canary/canary-${TARGET}-update-v2.json" bun -e 'const [metadata, manifest] = await Promise.all(["BUNDLE_METADATA_FILE", "UPDATE_MANIFEST_FILE"].map(key => Bun.file(process.env[key]).json())); if (manifest.version !== (await import("./package.json")).default.version) throw new Error("Unexpected macOS bundle version"); for (const key of ["identifier", "channel", "hash"]) if (!metadata[key] || metadata[key] !== manifest[key]) throw new Error("Unexpected macOS wrapper " + key)'
          hdiutil verify "${images[0]}"
          mount_dir="$(mktemp -d)"
          trap 'hdiutil detach "$mount_dir"; rmdir "$mount_dir"' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "${images[0]}"
          mounted=("$mount_dir"/*.app)
          test "${#mounted[@]}" -eq 1
          diff -qr "${apps[0]}" "${mounted[0]}"
      - name: Build and validate independent Portable profile
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          XNEON_BUILD_PORTABLE=1 bun scripts/electrobun.mjs build --env=dev
          bun scripts/package-windows-portable.ts checked-portable
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}-canary
          path: checked-native/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: native-linux-x64-packages
          path: checked-packages/*
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: native-win-x64-portable
          path: |
            checked-portable/*-portable.zip
            checked-portable/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [tests, build]
    if: github.repository == 'MAINER4IK/Xneon-Launcher-bun' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Determine prerelease identity
        id: release
        run: bun scripts/ci-pre-release.ts identity
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: release-candidates
      - name: Validate downloaded native artifacts and SHA256
        run: bun scripts/ci-pre-release.ts check release-candidates
      - name: Prepare exact prerelease allowlist, without rebuilding
        run: bun scripts/ci-pre-release.ts assemble release-candidates verified
      - name: Generate changelog
        run: bun scripts/release-notes.ts "$RUNNER_TEMP/release-notes.md"
      - name: Recheck repository and tag immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci-pre-release.ts guard-tag
      - name: Publish only verified native artifacts
        uses: softprops/action-gh-release@v2
        with:
          # guard-tag проверил существующий тег; target_commitish не нужен и требует лишних прав при дрейфе workflow.
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.version }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/release-notes.md
          files: verified/*
