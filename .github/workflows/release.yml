name: Release

# Стабильный релиз: обычный тег vX.Y.Z. Публикует только stable-артефакты.
on:
  push:
    tags: ['v*', '!v*-pre*', '!v*-beta*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  HUTCH_NO_UPDATE_CHECK: '1'
  BUN_OPTIONS: --no-env-file
  XNLC_SKIP_LOCAL_DOTENV: '1'
  XNLC_PARSER_LIVE_TESTS: '0'
  CHANNEL: stable

defaults:
  run:
    shell: bash

jobs:
  tests:
    # Тег vX.Y.Z-preN обслуживает pre-release.yml; здесь такой прогон пропускается.
    if: ${{ !contains(github.ref_name, '-pre') && !contains(github.ref_name, '-beta') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - &checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          desktop: 'true'
      - name: Check release channel
        run: bun scripts/ci-release.ts channel
      - name: Check version tag and main ancestry before the protected release
        if: github.repository == 'MAINER4IK/Xneon-Launcher-bun' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci-release.ts guard-tag
      - run: bun scripts/gen-agent-ipc-catalog.mjs --check
      - run: bun run prepare:desktop
      - run: bun scripts/check-config.mjs
      - run: bun scripts/check-import-cycles.mjs
      - run: bun run typecheck
      - name: Validate GitHub Actions syntax, expressions and dependencies
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$archive" | sha256sum --check -
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: Transpile main modules for desktop tests
        run: bun scripts/build-electrobun-tests.mjs
      - name: Offline tests (workspaces already prepared)
        run: bun run test:offline:prepared
      - name: Production renderer and worker bundles
        run: |
          bun run build:renderer
          bun run build:workers

  # Windows NSIS собирается здесь же из единственного stable payload, без повторного SDK build.
  build:
    needs: tests
    if: >-
      ${{ github.repository == 'MAINER4IK/Xneon-Launcher-bun' &&
          (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    name: Windows build (${{ matrix.target }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          # Production-публикация пока только для Windows.
          - { runner: windows-2022, target: win-x64, platform: win, arch: x64, machine: X64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - *checkout
      - uses: ./.github/actions/setup
        with:
          desktop: 'true'
      - name: Check release tag and package version before building
        if: startsWith(github.ref, 'refs/tags/v')
        run: bun scripts/ci-release.ts identity
      - name: Check native target
        shell: bash
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          RUNNER_MACHINE: ${{ runner.arch }}
        run: |
          set -euo pipefail
          test "$RUNNER_MACHINE" = "$EXPECTED_MACHINE"
      - name: Ensure NSIS
        shell: pwsh
        run: |
          $candidates = @(@(
            (Join-Path $env:ProgramFiles 'NSIS\makensis.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe')
          ) | Where-Object { Test-Path -LiteralPath $_ })
          if (-not $candidates) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $candidates = @(@((Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe')) | Where-Object { Test-Path -LiteralPath $_ })
          }
          if (-not $candidates) { throw 'makensis (NSIS 3) is required to build the Windows installer' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('XNEON_MAKENSIS=' + $candidates[0])
          & $candidates[0] /VERSION
      - name: Build stable Windows artifacts (NSIS)
        run: bun run build
      - name: Verify Windows platform adapters and PE metadata
        run: |
          set -euo pipefail
          bun test tests/electrobun/platform-desktop.test.ts tests/electrobun/platform-secrets.test.ts tests/electrobun/platform-unix.test.ts
          bun test tests/tooling/electrobun-packaging.test.mjs --test-name-pattern 'PE metadata'
      - name: Validate Windows payload, PE, NSIS and staging
        run: bun scripts/validate-pre-release.ts release-electrobun/stable checked-native stable
      - name: Build and validate independent Portable profile
        shell: bash
        run: |
          set -euo pipefail
          XNEON_BUILD_PORTABLE=1 bun scripts/electrobun.mjs build --env=dev
          bun scripts/package-windows-portable.ts checked-portable
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}-stable
          path: checked-native/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: native-win-x64-portable
          path: |
            checked-portable/*-portable.zip
            checked-portable/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  linux-preflight:
    # До проверки установки/обновлений Unix не входит в release allowlist.
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    name: Linux build (x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_PLATFORM: linux
      TARGET_ARCH: x64
      EXPECTED_MACHINE: x86_64
    steps:
      - *checkout
      - uses: ./.github/actions/setup
        with:
          desktop: 'true'
          linux-native-build: 'true'
      - name: Assert native runner architecture
        run: test "$(uname -m)" = "$EXPECTED_MACHINE"
      - name: Build Linux candidate
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = stable ]; then bun run build; else bun run build:canary; fi
      - name: Validate native artifacts and exact archive identity
        run: bun scripts/electrobun-artifacts.ts stage "release-electrobun/$CHANNEL" checked-unix "$TARGET_PLATFORM" "$TARGET_ARCH" "$CHANNEL"
      - name: Validate Linux CEF runtime and ABI
        run: |
          set -euo pipefail
          bun scripts/extract-native-payload.ts checked-unix native-payload "$CHANNEL" "$TARGET_PLATFORM" "$TARGET_ARCH"
          payload="native-payload/XneonLauncher"
          if [ "$CHANNEL" = canary ]; then payload="native-payload/XneonLauncher-canary"; fi
          bun scripts/unix-native-preflight.ts "$payload" checked-unix-extra "$CHANNEL"
      - name: Build Linux distribution packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm libarchive-tools xz-utils squashfs-tools file
          bun scripts/package-linux.ts checked-unix checked-unix-packages
      - name: Preserve candidate files and explicit validation limits (not release assets)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preflight-linux-x64-${{ env.CHANNEL }}
          path: |
            checked-unix/*
            checked-unix-extra/*
            checked-unix-packages/*
          if-no-files-found: warn
          retention-days: 7

  macos-preflight:
    # Независимый кандидат, не часть production-публикации.
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    name: macOS build (ARM64)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TARGET_PLATFORM: macos
      TARGET_ARCH: arm64
      EXPECTED_MACHINE: arm64
    steps:
      - *checkout
      - uses: ./.github/actions/setup
        with:
          desktop: 'true'
      - name: Assert native runner architecture
        run: test "$(uname -m)" = "$EXPECTED_MACHINE"
      - name: Build macOS candidate
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = stable ]; then bun run build; else bun run build:canary; fi
      - name: Validate macOS artifacts and exact archive identity
        run: bun scripts/electrobun-artifacts.ts stage "release-electrobun/$CHANNEL" checked-unix "$TARGET_PLATFORM" "$TARGET_ARCH" "$CHANNEL"
      - name: Validate macOS payload and prepare DMG and ZIP
        run: |
          set -euo pipefail
          bun scripts/extract-native-payload.ts checked-unix native-payload "$CHANNEL" "$TARGET_PLATFORM" "$TARGET_ARCH"
          payload="native-payload/Xneon Launcher.app"
          if [ "$CHANNEL" = canary ]; then payload="native-payload/Xneon Launcher-canary.app"; fi
          bun scripts/unix-native-preflight.ts "$payload" checked-unix-extra "$CHANNEL"
      - name: Verify native macOS image and application bundle
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(release-electrobun/"$CHANNEL"/*.dmg)
          apps=(build-electrobun/"$CHANNEL"-macos-arm64/*.app)
          test "${#images[@]}" -eq 1
          test "${#apps[@]}" -eq 1
          plist="${apps[0]}/Contents/Info.plist"
          executable="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$plist")"
          [[ "$executable" != */* ]]
          test -x "${apps[0]}/Contents/MacOS/$executable"
          test "$(lipo -archs "${apps[0]}/Contents/MacOS/$executable")" = "$EXPECTED_MACHINE"
          BUNDLE_METADATA_FILE="${apps[0]}/Contents/Resources/metadata.json" UPDATE_MANIFEST_FILE="release-electrobun/$CHANNEL/${CHANNEL}-macos-arm64-update-v2.json" bun -e 'const [metadata, manifest] = await Promise.all(["BUNDLE_METADATA_FILE", "UPDATE_MANIFEST_FILE"].map(key => Bun.file(process.env[key]).json())); if (manifest.version !== (await import("./package.json")).default.version) throw new Error("Unexpected macOS bundle version"); for (const key of ["identifier", "channel", "hash"]) if (!metadata[key] || metadata[key] !== manifest[key]) throw new Error("Unexpected macOS wrapper " + key)'
          hdiutil verify "${images[0]}"
          mount_dir="$(mktemp -d)"
          trap 'hdiutil detach "$mount_dir"; rmdir "$mount_dir"' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "${images[0]}"
          mounted=("$mount_dir"/*.app)
          test "${#mounted[@]}" -eq 1
          diff -qr "${apps[0]}" "${mounted[0]}"
      - name: Run macOS DMG and ZIP smoke
        run: bun scripts/smoke-macos.ts checked-unix-extra unix-smoke
      - name: Preserve macOS candidate files and validation evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preflight-macos-arm64-${{ env.CHANNEL }}
          path: |
            checked-unix/*
            checked-unix-extra/*
            unix-smoke/*
          if-no-files-found: warn
          retention-days: 7

  release:
    needs: [tests, build]
    if: github.repository == 'MAINER4IK/Xneon-Launcher-bun' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: pre2-signing
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Determine stable release identity
        id: release
        run: bun scripts/ci-release.ts identity
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: release-candidates
      - name: Validate downloaded native artifacts and SHA256 before signing
        run: bun scripts/ci-release.ts check release-candidates
      - name: Sign the exact stable manifest
        env:
          XNLC_UPDATE_PRIVATE_KEY: ${{ secrets.XNLC_UPDATE_PRIVATE_KEY }}
          XNLC_UPDATE_KEY_ID: ${{ vars.XNLC_UPDATE_KEY_ID }}
        run: |
          set -euo pipefail
          bun scripts/sign-update-feed.ts stable release-candidates/native-win-x64-stable signed-update
          mkdir release-candidates/update-verified
          cp signed-update/* release-candidates/update-verified/
          version="$(bun -p 'require("./package.json").version')"
          cp "release-candidates/native-win-x64-stable/xneon-launcher-$version-win-x64.exe" release-candidates/update-verified/
      - name: Verify trusted Ed25519 signatures and exact publication bytes
        run: |
          set -euo pipefail
          bun scripts/verify-signed-update-feed.ts release-candidates/update-verified
          (cd release-candidates/update-verified && sha256sum --check SHA256SUMS.txt)
      - name: Prepare exact signed release allowlist, without rebuilding
        run: bun scripts/ci-release.ts assemble release-candidates verified
      - name: Generate changelog
        run: bun scripts/release-notes.ts "$RUNNER_TEMP/release-notes.md"
      - name: Recheck repository and tag immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci-release.ts guard-tag
      - name: Publish only verified native artifacts
        uses: softprops/action-gh-release@v2
        with:
          # guard-tag проверил существующий тег; target_commitish не нужен и требует лишних прав при дрейфе workflow.
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.version }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/release-notes.md
          files: verified/*
