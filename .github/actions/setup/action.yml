name: Pinned Bun and Electrobun dependencies
description: Общая установка зависимостей; desktop включает проверенный Hutch и системные библиотеки.
inputs:
  desktop:
    description: Установить toolchain для prepare/build/test.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.4
    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.4-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-1.4.4-
    - name: Check pinned dependencies
      shell: bash
      run: |
        set -euo pipefail
        test "$(bun --version)" = 1.4.4
        test "$(bun -p 'require("./package.json").devDependencies.electrobun')" = 2.0.6
    - name: Install Hutch (Windows)
      if: inputs.desktop == 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        $installer = Join-Path $env:RUNNER_TEMP 'hutch-install.ps1'
        Invoke-WebRequest -Uri 'https://hutch.blackboard.sh/hutch/install.ps1' -OutFile $installer
        if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne '185CC615D3D1B6E7156C104BEB902CCE3F4B9F35CB3D14DF047586AA432883E7') { throw 'Hutch bootstrap checksum mismatch' }
        & $installer -Version 0.29.0 -NoModifyPath
        $bin = Join-Path $env:USERPROFILE '.hutch/bin'
        if ((& (Join-Path $bin 'hutch.exe') --version) -ne '0.29.0') { throw 'Unexpected Hutch version' }
        Add-Content -LiteralPath $env:GITHUB_PATH -Value $bin
    - name: Install Hutch (Unix)
      if: inputs.desktop == 'true' && runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        bootstrap="$RUNNER_TEMP/hutch-install.sh"
        curl --fail --silent --show-error --location https://hutch.blackboard.sh/hutch/install.sh -o "$bootstrap"
        echo 'ac0ad498dfb09d2bc80fc9a6a0254c183cd0f125c83dce32defff65a1cf793e7  '"$bootstrap" | shasum -a 256 -c -
        bash "$bootstrap" --version 0.29.0 --no-modify-path
        test "$("$HOME/.hutch/bin/hutch" --version)" = 0.29.0
        echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"
    - name: Linux native prerequisites
      if: inputs.desktop == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libsecret-1-0 binutils zstd
    - name: Install dependencies
      shell: bash
      env:
        DESKTOP: ${{ inputs.desktop }}
      run: |
        set -euo pipefail
        if [ "$DESKTOP" = true ]; then
          bun install --frozen-lockfile
        else
          bun install --frozen-lockfile --ignore-scripts
        fi
